# Serves the built SPA and reverse-proxies the API + STOMP WebSocket to the gateway,
# so the browser only ever talks to ONE origin. That is what lets a single frontend
# image work in every environment (no VITE_* baked at build time).

server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # payment-service accepts proof uploads up to 5 MB (spring.servlet.multipart).
    # nginx defaults to 1 MB and would return 413 before the request ever reaches the
    # gateway. Chat image upload has the same 5 MB limit.
    client_max_body_size 10m;

    # Docker's embedded DNS. Combined with a variable in proxy_pass below this makes
    # nginx re-resolve the gateway on every request. With a literal host in
    # proxy_pass, nginx resolves ONCE at config load and caches it forever — so a
    # gateway restart (new container IP) would 502 permanently, and nginx would even
    # refuse to start if the gateway were not yet resolvable.
    resolver     127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:3000;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # Hashed Vite assets are immutable
    location /assets/ {
        expires   1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> gateway
    location /api {
        proxy_pass $gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Origin            $http_origin;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The AI assistant streams Server-Sent Events. Buffering would hold the whole
        # stream back and deliver it in one lump at the end.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # STOMP over WebSocket -> gateway -> chat-service.
    # No trailing slash: chat-service registers the endpoint at exactly "/ws"
    # (WebSocketConfig.registerStompEndpoints), and the frontend connects to "/ws".
    # `location /ws/` would NOT match "/ws".
    location /ws {
        proxy_pass $gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     $http_origin;

        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback — keep last so it does not shadow /api and /ws
    location / {
        try_files $uri $uri/ /index.html;
    }
}
