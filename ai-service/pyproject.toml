[project]
name = "ai-service"
version = "0.1.0"
description = "BadmintonHub AI service — conversational booking concierge (FastAPI · LangGraph · MCP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "py-eureka-client>=0.11",
    "pyjwt>=2.10",
    "fastmcp>=2.0",
    # --- agent (Day 2): LangGraph + Gemini. mcp-adapters/checkpoint-postgres installed now,
    #     the MCP-load path and the postgres checkpointer are wired later (Day 3/4). ---
    "langgraph>=0.2.60",
    "langchain-core>=0.3.29",
    "langchain-google-genai>=2.0.8",
    "langchain-mcp-adapters>=0.1",
    "langgraph-checkpoint-postgres>=2.0",
    "structlog>=24.4",
    "opentelemetry-sdk",
    "opentelemetry-exporter-zipkin-json",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.8",
]

# This is an application, not an installable library — uv should not try to build/install it.
[tool.uv]
package = false
# Self-contained: only ever use a Python that uv downloads & manages (never the machine's
# system Python), and fetch it automatically. Deleting/upgrading any system Python won't
# break this service — just `uv sync` again.
python-preference = "only-managed"
python-downloads = "automatic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Migration column definitions and test JSON fixtures are naturally long / readable inline.
"migrations/versions/*" = ["E501"]
"tests/**" = ["E501"]
